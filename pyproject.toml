[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gameforge-omega"
version = "0.1.0-alpha"
description = "GameForge Ω — Sovereign World Engine. The world is the source of truth."
authors = [{name = "Steven Craig Leake Jr."}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0.0", "numpy>=1.24.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gameforge*"]
